services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "5434:5432"

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
